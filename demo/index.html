<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>contribution-dots demo</title>
    <style>
      body { margin: 0; background: #fafafa; color: #737373; font-family: system-ui, sans-serif; }
      main { width: 400px; margin: 48px auto; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@19/client"
        }
      }
    </script>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      import { createElement } from "react";
      import { createRoot } from "react-dom/client";
      import { ContributionDots } from "../dist/index.js";

      // ?user=name to try someone else, ?width=320 to try a narrower chart
      const params = new URLSearchParams(location.search);
      createRoot(document.getElementById("root")).render(
        createElement(ContributionDots, {
          username: params.get("user") ?? "galzorigo",
          width: params.has("width") ? Number(params.get("width")) : undefined,
          onError: (e) => (document.title = "error: " + e.message),
        }),
      );
    </script>
  </body>
</html>
